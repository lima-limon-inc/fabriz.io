# This action will be triggered when a new github release is made.
# Sidenote: Currently github releases are created manually.
name: Publish Rust Crates on Release

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to build from'
        required: true
        type: string
      tag:
        description: 'Tag name for the draft release (e.g. v0.12.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Create (or reuse) a draft release at the given SHA. The git tag itself is
  # only created when the draft is published.
  create-draft:
    name: create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or validate draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -e
          is_draft=$( { gh release view "${RELEASE_TAG}" --json isDraft | jq -r .isDraft; } 2>&1 )
          echo ${is_draft}
          case "${is_draft}" in
            true)
              echo "Reusing existing draft ${RELEASE_TAG}."
              ;;
            false)
              echo "Release ${RELEASE_TAG} already exists and is published. Refusing to touch it." >&2
              exit 1
              ;;
            "release not found")
              gh release create "${RELEASE_TAG}" \
                --draft \
                --target "${RELEASE_SHA}" \
                --title "v${RELEASE_TAG}"
              ;;
            *)
              echo "Unexpected output from gh release view: ${is_draft}" >&2
              exit 1
              ;;
          esac

  # Upload the fabrizio CLI as an artifact on the Github release.
  # This is used by midenup to speed installs up.
  upload-artifacts:
    name: upload pre-built fabrizio executable artifacts
    needs: create-draft
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        target: [aarch64-apple-darwin, x86_64-unknown-linux-gnu]
        exclude:
          - os: macos-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - name: Install Rust
        run: |
          rustup update --no-self-update
          rustc --version
      - name: Add target
        run: |
          rustup target add ${{ matrix.target }}
      - name: Build fabrizio
        run: |
          BUILD_TARGET=${{ matrix.target }} make build-cli 
      - name: Prepare artifact
        run: |
          mv target/${{ matrix.target }}/release/fabrizio fabrizio-${{ matrix.target }}
      - name: Attest fabrizio
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: fabrizio-${{ matrix.target }}
      - name: Upload
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload ${RELEASE_TAG} fabrizio-${{ matrix.target }}
